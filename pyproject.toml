[project]
name = "xiaomao"
version = "0.1.0"
description = "小贸同学：面向中小跨境卖家的 RAG 问答 SaaS"
requires-python = ">=3.12,<3.13"
dependencies = [
    "python-dotenv>=1.0",
    "pymilvus>=2.6",
    "pymysql>=1.1",
    "redis>=6.0",
    "openai>=1.50",
    "httpx>=0.27",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "bcrypt>=5.0.0",
    "pyjwt>=2.15.1",
]

# 用 uv 管理：uv sync 装全部依赖组，脚本一律用 uv run 运行
[dependency-groups]
# 本地模型（BGE-M3、reranker、Jev-Style 决策模型）；torch 走下面配置的 CUDA 12.8 源
ml = [
    "torch==2.11.0",
    "torchvision==0.26.0",
    "FlagEmbedding>=1.4",
    "transformers>=5.21",
    "jev-style[torch]==0.6.1",
    "huggingface_hub",
]
# M1 数据处理：HTML/PDF 解析
ingest = [
    "trafilatura>=2.0",
    "pymupdf>=2.0",  # pymupdf 2.x 已内置原 pymupdf4llm 的 Markdown 导出
    "lxml>=6.0",     # parse.py 的站点规则直接用 lxml
]
dev = [
    "openpyxl>=3.1",
    "pytest>=8",
]

[tool.uv]
default-groups = ["dev", "ml", "ingest"]
# 只在 Windows（本机）和 Linux（以后部署）上解析，PyTorch 的 CUDA 源没有 macOS 包
environments = ["sys_platform == 'win32'", "sys_platform == 'linux'"]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/xiaomao"]
